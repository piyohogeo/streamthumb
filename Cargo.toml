[workspace]
members = [
    "crates/streamthumb-core",
    "crates/streamthumb-encode",
    "crates/streamthumb-cli",
    "crates/streamthumb-png",
    "crates/streamthumb-wasm",
]
resolver = "2"
exclude = [
    "benchmarks",
    "fuzz",
    "spikes/incremental-input",
    "spikes/jpeg-encoder-selection",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piyohogeo/streamthumb"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
