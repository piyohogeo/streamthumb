name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p streamthumb-wasm --target wasm32-unknown-unknown

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
      - name: Test in Chrome
        run: |
          printf '{"goog:chromeOptions":{"binary":"%s","args":[]}}\n' '${{ steps.chrome.outputs.chrome-path }}' > crates/streamthumb-wasm/webdriver.json
          wasm-pack test --headless --chrome --chromedriver=${{ steps.chrome.outputs.chromedriver-path }} crates/streamthumb-wasm
          rm -f crates/streamthumb-wasm/webdriver.json
      - run: wasm-pack test --headless --firefox crates/streamthumb-wasm

  benchmark-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path benchmarks/Cargo.toml --check
      - run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
      - run: node --check benchmarks/run-wasm.cjs
