name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p streamthumb-png --example native_reader -- fuzz/corpus/thumbnail_png/pngsuite_basn6a08.png target/native-reader-example.png cover
      - run: cargo run -p streamthumb-png --example native_reader -- fuzz/corpus/thumbnail_png/pngsuite_basn6a08.png target/native-reader-example.jpg contain
      - run: cargo fmt --manifest-path spikes/incremental-input/Cargo.toml --check
      - run: cargo clippy --manifest-path spikes/incremental-input/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path spikes/incremental-input/Cargo.toml

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p streamthumb-wasm --target wasm32-unknown-unknown

  rust-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Unpublished path dependencies cannot be verified from crates.io yet.
      # Workspace compilation is covered by the native job; this job audits archives.
      - run: cargo package --workspace --no-verify

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2.85.9
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.5
      - uses: browser-actions/setup-chrome@v2
        id: package-chrome
      - run: node scripts/check-public-api.mjs
      - run: node --check examples/browser/main.js && node --check examples/browser/smoke.js && node --check examples/browser/worker.js && node --check examples/node/thumbnail.mjs
      - run: node scripts/build-npm-package.mjs
      - run: node scripts/check-npm-package.mjs
      - run: mkdir -p target/npm-artifacts && npm pack ./target/npm-package --pack-destination target/npm-artifacts
      - name: Test TypeScript package consumer in Chrome
        run: node scripts/test-npm-package-browser.mjs target/npm-artifacts/*.tgz '${{ steps.package-chrome.outputs.chrome-path }}'
      - name: Test public browser example in Chrome
        run: node scripts/test-browser-example.mjs '${{ steps.package-chrome.outputs.chrome-path }}'
      - name: Test package consumers in Node.js and Deno
        run: node scripts/test-npm-package-runtimes.mjs target/npm-artifacts/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: target/npm-artifacts/*.tgz
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2.85.9
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
      - name: Test in Chrome
        run: |
          printf '{"goog:chromeOptions":{"binary":"%s","args":[]}}\n' '${{ steps.chrome.outputs.chrome-path }}' > crates/streamthumb-wasm/webdriver.json
          wasm-pack test --headless --chrome --chromedriver=${{ steps.chrome.outputs.chromedriver-path }} crates/streamthumb-wasm
          rm -f crates/streamthumb-wasm/webdriver.json
      - run: wasm-pack test --headless --firefox crates/streamthumb-wasm

  benchmark-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmarks/package-lock.json
      - run: cargo fmt --manifest-path benchmarks/Cargo.toml --check
      - run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
      - run: node --check benchmarks/run-wasm.cjs
      - run: npm ci --prefix benchmarks
      - run: npm run check --prefix benchmarks
      - run: STREAMTHUMB_BENCHMARK_CHILD=1 node benchmarks/run-jsquash.mjs fuzz/corpus/thumbnail_png/pngsuite_basn6a08.png 8
