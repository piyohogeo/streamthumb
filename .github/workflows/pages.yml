name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2.85.9
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: node scripts/check-public-api.mjs
      - run: node scripts/build-npm-package.mjs
      - run: node scripts/check-npm-package.mjs
      - run: node scripts/build-pages-demo.mjs
      - run: node scripts/test-pages-demo.mjs '${{ steps.chrome.outputs.chrome-path }}'
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
